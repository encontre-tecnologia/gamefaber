// desempenho: junta as peças paradas (prédios, ruas, cercas...) em poucos blocos por material e por região,
// mantendo separado o que se mexe ou some (carros, pessoas, cancela, vapor, telhados que abrem, marcadores)
function mergeStatic(){S.updateMatrixWorld(true);
 const snap=new Map();S.traverse(o=>{if(o.isMesh)snap.set(o,o.matrixWorld.clone());});
 try{if(window.STEAMF)window.STEAMF(1.3);if(window.GATEF)window.GATEF(4.1);if(window.WALKF)window.WALKF(.4);}catch(e){}
 S.updateMatrixWorld(true);const moved=new Set();snap.forEach((m,o)=>{if(!m.equals(o.matrixWorld))moved.add(o);});
 const dyn=new Set();for(const v of movers)dyn.add(v.m);
 const boxes=PROD.map(P=>{const [x1,y1,x2,y2]=P.b;return [wx(x1)-.9,wx(x2)+.9,wz(y1)-.9,wz(y2)+.9];});
 const mk=m=>{const f=[m.type,m.side,m.transparent?1:0,m.opacity,m.alphaTest,m.depthWrite?1:0,m.blending,m.toneMapped?1:0,m.flatShading?1:0,m.vertexColors?1:0,m.polygonOffset?1:0,m.polygonOffsetFactor,m.fog?1:0];
  for(const k of ['color','emissive'])if(m[k])f.push(m[k].getHexString());for(const k of ['emissiveIntensity','roughness','metalness'])if(m[k]!==undefined)f.push(m[k]);
  for(const k of ['map','emissiveMap','normalMap','roughnessMap','metalnessMap','alphaMap','envMap','aoMap','bumpMap'])if(m[k])f.push(k+m[k].uuid);return f.join('|');};
 const buckets=new Map();
 for(const top of [...S.children]){if(!top.visible||top.isLight||top.isInstancedMesh||dyn.has(top)||top.userData.dyn)continue;
  const q=top.position,keep=!!top.userData.keep;let hk='';if(!keep&&q.y<30)boxes.forEach(([a,b,c,d],i)=>{if(q.x>a&&q.x<b&&q.z>c&&q.z<d)hk+=i+',';});
  const reg=keep?'K':hk?'P'+hk:'G'+Math.floor(q.x/45)+'_'+Math.floor(q.z/45);
  const stack=[top];while(stack.length){const o=stack.pop();if(!o.visible||o.userData.dyn||dyn.has(o))continue;for(const c of o.children)stack.push(c);
   if(!o.isMesh||o.isInstancedMesh||o.isSkinnedMesh||moved.has(o)||Array.isArray(o.material)||o.onBeforeRender!==THREE.Object3D.prototype.onBeforeRender)continue;
   const g=o.geometry;if(!g||!g.attributes.position||!g.attributes.normal||g.morphAttributes.position||o.matrixWorld.determinant()<=0)continue;if(g.drawRange.count!==Infinity)continue;
   const key=reg+'#'+mk(o.material)+'#'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+(o.frustumCulled?1:0)+'#'+o.renderOrder;
   let b=buckets.get(key);if(!b){b={reg,keep,top,mat:o.material,cs:o.castShadow,rs:o.receiveShadow,ro:o.renderOrder,list:[]};buckets.set(key,b);}b.list.push(o);}}
 // carros, motos, pessoas e salões: junta dentro do próprio grupo o que não se mexe em relação a ele
 const roofSet=new Set();HALLS.forEach(h=>h.roof.forEach(r=>r.traverse(x=>roofSet.add(x))));
 const locals=[...movers.map(v=>v.m),...HALLS.map(h=>h.g)];
 locals.forEach((root,ri)=>{const st=[root];while(st.length){const o=st.pop();if(!o.visible||roofSet.has(o)||moved.has(o))continue;for(const c of o.children)st.push(c);
  if(!o.isMesh||o.isInstancedMesh||Array.isArray(o.material))continue;const g=o.geometry;if(!g||!g.attributes.position||!g.attributes.normal||o.matrixWorld.determinant()<=0||g.drawRange.count!==Infinity)continue;
  const key='L'+ri+'#'+mk(o.material)+'#'+(o.castShadow?1:0)+(o.receiveShadow?1:0);let b=buckets.get(key);if(!b){b={par:root,top:root,mat:o.material,cs:o.castShadow,rs:o.receiveShadow,ro:o.renderOrder,list:[]};buckets.set(key,b);}b.list.push(o);}});
 let before=0,after=0;const v=new THREE.Vector3(),nm=new THREE.Matrix3();
 buckets.forEach(b=>{if(b.list.length<2)return;before+=b.list.length;after++;
  let nv=0,ni=0;for(const o of b.list){const g=o.geometry;nv+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count;}
  const P=new Float32Array(nv*3),N=new Float32Array(nv*3),U=new Float32Array(nv*2),I=nv>65535?new Uint32Array(ni):new Uint16Array(ni);
  const org=b.top.position.clone();let vo=0,io=0;const inv=b.par?new THREE.Matrix4().copy(b.par.matrixWorld).invert():null,mw=new THREE.Matrix4();if(inv)org.set(0,0,0);
  for(const o of b.list){const g=o.geometry,pa=g.attributes.position,na=g.attributes.normal,ua=g.attributes.uv;mw.copy(o.matrixWorld);if(inv)mw.premultiply(inv);nm.getNormalMatrix(mw);
   for(let i=0;i<pa.count;i++){v.fromBufferAttribute(pa,i).applyMatrix4(mw).sub(org);P[(vo+i)*3]=v.x;P[(vo+i)*3+1]=v.y;P[(vo+i)*3+2]=v.z;
    v.fromBufferAttribute(na,i).applyMatrix3(nm).normalize();N[(vo+i)*3]=v.x;N[(vo+i)*3+1]=v.y;N[(vo+i)*3+2]=v.z;
    if(ua){U[(vo+i)*2]=ua.getX(i);U[(vo+i)*2+1]=ua.getY(i);}}
   if(g.index){const ix=g.index;for(let i=0;i<ix.count;i++)I[io+i]=ix.getX(i)+vo;io+=ix.count;}else{for(let i=0;i<pa.count;i++)I[io+i]=vo+i;io+=pa.count;}
   vo+=pa.count;o.parent.remove(o);}
  const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(P,3));G.setAttribute('normal',new THREE.BufferAttribute(N,3));G.setAttribute('uv',new THREE.BufferAttribute(U,2));G.setIndex(new THREE.BufferAttribute(I,1));G.computeBoundingSphere();G.computeBoundingBox();
  const m=new THREE.Mesh(G,b.mat);m.position.copy(org);m.castShadow=b.cs;m.receiveShadow=b.rs;m.renderOrder=b.ro;if(!b.par){m.matrixAutoUpdate=false;m.updateMatrix();}if(b.keep)m.userData.keep=true;(b.par||S).add(m);});
 // grupos que ficaram vazios saem da cena
 for(const o of [...S.children])if(o.isGroup&&!o.children.length&&!o.userData.dyn&&!dyn.has(o))S.remove(o);
 console.log('mergeStatic:',before,'peças viraram',after,'blocos');}

{const PR0=R.getPixelRatio(),PRMIN=MOB?.75:.9;let acc=0,fr=0,cool=3;window.ADAPT=rdt=>{if(document.hidden||rdt>.5)return;acc+=rdt;fr++;if(acc<1.5)return;const fps=fr/acc;acc=0;fr=0;if(cool>0){cool--;return;}
